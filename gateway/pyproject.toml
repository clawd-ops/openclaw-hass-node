[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-gateway"
version = "2026.6.0"
description = "OpenClaw HA gateway brain and conversation handler"
requires-python = ">=3.13"
dependencies = [
    "anthropic>=0.40",
    "aiohttp>=3.10",
    "websockets>=13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_gateway"]
