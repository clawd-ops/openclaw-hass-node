---
name: OpenClaw Node
version: "2026.6.8a1"
slug: openclaw_hass_node
description: >
  OpenClaw gateway peripheral for Home Assistant (alpha). Connects this HA
  instance to the OpenClaw gateway as a node, exposing filesystem, shell,
  and HA control surfaces. The Assist conversation relay is not yet wired
  (P5.12) and currently returns a placeholder response.
url: https://github.com/clawd-ops/openclaw-hass-node
arch:
  - amd64
  - aarch64
  - armv7
init: false
# hassio_api: required to call Supervisor REST endpoints (addon status,
# snapshot triggers, host info). hassio_role:manager is the minimum role
# that allows add-on and HA lifecycle management; the alpha feature set
# does not require supervisor-level admin (ingress, OS updates, hardware).
# Elevate to "admin" only when a shipped feature explicitly requires it.
hassio_api: true
hassio_role: manager
homeassistant_api: true
# auth_api: needed to validate bearer tokens for the local HTTP API.
auth_api: true
map:
  # config:rw — core feature: read/write HA configuration files on behalf
  # of the gateway (e.g. automations, scripts, lovelace).
  - config:rw
  # share:rw — core feature: read/write the /share volume for cross-addon
  # data exchange and gateway-requested file operations.
  - share:rw
  # ssl:ro — read-only: the node reads TLS certificates for HA API calls
  # but never writes to the ssl volume in the current feature set.
  - ssl:ro
  # addons:ro — read-only: addon enumeration and status reads only.
  # No add-on installation or write operations are implemented yet.
  - addons:ro
  # media:rw — read/write: media file operations exposed to the gateway.
  - media:rw
  # backup:ro — read-only for now: backup listing and download. Snapshot
  # creation via Supervisor API does not require rw on the backup volume
  # directly; elevate to rw only when a backup-write feature lands.
  - backup:ro
options:
  gateway_url: "wss://gateway.example.com/ws"
  pairing_token: ""
  node_name: ""
  local_api_token: ""
schema:
  gateway_url: url
  pairing_token: password
  node_name: str?
  local_api_token: password?
# No `ports:` host-mapping. The local API is only reachable inside the
# Supervisor add-on network (the HACS shim uses the add-on hostname). A
# host-mapped port would expose the API to anything on the host network,
# and the API is bearer-auth-gated only when local_api_token is set.
ingress: false
panel_icon: mdi:robot-happy
# No `image:` key — Supervisor builds locally from addon/Dockerfile.
# Once P7 ships a release workflow that publishes per-arch images to
# GHCR, re-add: image: ghcr.io/clawd-ops/openclaw-hass-node/{arch}
