---
name: OpenClaw Node
version: "2026.6.8a1"
slug: openclaw_hass_node
description: >
  OpenClaw gateway peripheral for Home Assistant (alpha). Connects this HA
  instance to the OpenClaw gateway as a node, exposing filesystem, shell,
  and HA control surfaces. The Assist conversation relay is not yet wired
  (P5.12) and currently returns a placeholder response.
url: https://github.com/clawd-ops/openclaw-hass-node
arch:
  - amd64
  - aarch64
  - armv7
init: false
# homeassistant_api: enables HA Core API access at
# http://supervisor/core/api with SUPERVISOR_TOKEN. Used by `ha_client`
# and `commands/ha` to proxy HA Core/WS calls.
#
# hassio_api intentionally omitted: shipped code does not call the
# Supervisor API at http://supervisor/ (no add-on/host/backup lifecycle
# usage). Re-enable only when a shipped Supervisor lifecycle feature
# needs it; pair with `hassio_role: manager`/`admin` only as that
# feature actually requires.
homeassistant_api: true
# auth_api intentionally omitted: the local HTTP API authenticates with a
# shared bearer (`local_api_token`) via `hmac.compare_digest`, not via the
# HA Auth API. Re-enable only if a shipped surface validates HA-issued
# tokens with the Supervisor auth endpoint.
map:
  # config:ro — `/config` is exposed as an allowed read root. Writes are
  # gated and currently return `PROPOSAL_REQUIRED` (proposal bridge not
  # shipped); upgrade to `:rw` only when the proposal flow lands.
  - config:ro
  # share:rw — backs the per-file content-addressed backup store
  # (/share/openclaw-backups) and the delete trash fallback
  # (/share/openclaw-trash). Real shipped writes.
  - share:rw
  # media:rw — `/media` is an allowed root and not protected, so
  # `fs.write` can resolve and atomically write here.
  - media:rw
# Removed maps (re-add when a shipped feature needs them):
#   ssl:ro      — would expose TLS certs via generic fs.read/list/glob
#   addons:ro   — no shipped add-on enumeration reader
#   backup:ro   — exposing /backup leaks full-backup material via generic reads
options:
  gateway_url: "wss://gateway.example.com/ws"
  pairing_token: ""
  node_name: ""
  local_api_token: ""
schema:
  gateway_url: url
  pairing_token: password
  node_name: str?
  local_api_token: password?
# No `ports:` host-mapping. The local API is only reachable inside the
# Supervisor add-on network (the HACS shim uses the add-on hostname). A
# host-mapped port would expose the API to anything on the host network,
# and the API is bearer-auth-gated only when local_api_token is set.
ingress: false
panel_icon: mdi:robot-happy
# No `image:` key — Supervisor builds locally from addon/Dockerfile.
# Once P7 ships a release workflow that publishes per-arch images to
# GHCR, re-add: image: ghcr.io/clawd-ops/openclaw-hass-node/{arch}
