---
name: OpenClaw Node
version: "2026.6.8a7"
slug: openclaw_hass_node
description: >
  OpenClaw gateway peripheral for Home Assistant (alpha). Connects this HA
  instance to the OpenClaw gateway as a node, exposing filesystem, shell,
  and HA control surfaces. The Assist conversation relay (P5.13) is wired
  through parallel node-role and operator-role gateway connections; pair
  the device with a dual-role profile (`openclaw qr`).
url: https://github.com/clawd-ops/openclaw-hass-node
arch:
  - amd64
  - aarch64
  - armv7
init: false
# homeassistant_api: enables HA Core API access at
# http://supervisor/core/api with SUPERVISOR_TOKEN. Used by `ha_client`
# and `commands/ha` to proxy HA Core/WS calls.
#
# hassio_api intentionally omitted: shipped code does not call the
# Supervisor API at http://supervisor/ (no add-on/host/backup lifecycle
# usage). Re-enable only when a shipped Supervisor lifecycle feature
# needs it; pair with `hassio_role: manager`/`admin` only as that
# feature actually requires.
homeassistant_api: true
# auth_api intentionally omitted: the local HTTP API authenticates with a
# shared bearer (`local_api_token`) via `hmac.compare_digest`, not via the
# HA Auth API. Re-enable only if a shipped surface validates HA-issued
# tokens with the Supervisor auth endpoint.
map:
  # config:rw — `/config` write capability is granted at the OS layer
  # so the proposal-approved write path can land without re-touching
  # this manifest.
  #
  # For the fs.* mutation commands (fs.write, fs.patch, fs.restore,
  # fs.move, fs.delete), the actual write-protection boundary is the
  # software gate: `_is_protected("/config")` returns True and each
  # handler returns `PROPOSAL_REQUIRED` before any disk write/unlink/
  # rename is attempted (see addon/node/src/openclaw_node/commands/
  # fs_write.py, commands/fs_patch.py, commands/fs_move_delete.py).
  #
  # NOT gated: `system.run` (commands/system_run.py) is admin-token
  # gated (OPENCLAW_ADMIN_TOKEN) and can write anywhere the mount
  # allows, including /config. The admin token is the protection
  # boundary there, NOT _is_protected. Don't broaden system.run's
  # capabilities without re-evaluating this trade-off.
  - config:rw
  # share:rw — backs the per-file content-addressed backup store
  # (/share/openclaw-backups) and the delete trash fallback
  # (/share/openclaw-trash). Real shipped writes.
  - share:rw
  # media:rw — `/media` is an allowed root and not protected, so
  # `fs.write` can resolve and atomically write here.
  - media:rw
# Removed maps (re-add when a shipped feature needs them):
#   ssl:ro      — would expose TLS certs via generic fs.read/list/glob
#   addons:ro   — no shipped add-on enumeration reader
#   backup:ro   — exposing /backup leaks full-backup material via generic reads
options:
  gateway_url: "wss://gateway.example.com/ws"
  pairing_token: ""
  node_name: ""
  local_api_token: ""
  # HA credentials fallback. Leave blank to use the Supervisor-injected
  # SUPERVISOR_TOKEN against http://supervisor/core. Set when running on
  # a Supervisor that doesn't inject the token (or for standalone Docker)
  # — hass_url is the HA base URL (e.g. http://homeassistant:8123 from
  # inside the add-on network, or your full HTTPS URL externally), and
  # hass_token is a long-lived access token from a HA user with the
  # scopes your ha.* calls need.
  hass_url: ""
  hass_token: ""
  # One-shot pairing reset. When true, on next start the node deletes
  # any persisted device_token (and device identity) under /data/openclaw
  # before connecting, then proceeds with the bootstrap token from
  # `pairing_token`. Toggle back to false after the node reconnects
  # successfully — leaving it true would wipe pairing on every restart.
  reset_pairing: false
schema:
  gateway_url: url
  pairing_token: password
  node_name: str?
  local_api_token: password?
  hass_url: str?
  hass_token: password?
  reset_pairing: bool?
# No `ports:` host-mapping. The local API is only reachable inside the
# Supervisor add-on network (the HACS shim uses the add-on hostname). A
# host-mapped port would expose the API to anything on the host network,
# and the API is bearer-auth-gated only when local_api_token is set.
ingress: false
panel_icon: mdi:robot-happy
# No `image:` key — Supervisor builds locally from addon/Dockerfile.
# Once P7 ships a release workflow that publishes per-arch images to
# GHCR, re-add: image: ghcr.io/clawd-ops/openclaw-hass-node/{arch}
