site_name: openclaw-hass-node
site_description: Home Assistant node for OpenClaw — commands, authorization, and operations.
repo_url: https://github.com/clawd-ops/openclaw-hass-node
repo_name: clawd-ops/openclaw-hass-node
edit_uri: edit/main/docs/

strict: true

theme:
  name: material
  icon:
    logo: material/home-assistant
    repo: fontawesome/brands/github
  # Default Material is light indigo, which reads as a generic template and does
  # not match the dark OpenClaw surfaces this project is operated from. Ship a
  # deliberate palette with a working light/dark toggle that follows the OS.
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.top
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - toc.follow
    - search.highlight
    - search.suggest
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tooltips

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  # Unsupported syntax renders as literal text and --strict does not object.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde:
      subscript: false
  - pymdownx.mark

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths:
            - app/node/src
          options:
            docstring_style: google
            docstring_options:
              warn_unknown_params: false
            show_source: true
            show_root_heading: true
            show_submodules: false
            members_order: source

nav:
  - Overview: README.md
  - Install: INSTALL.md
  - Status: STATUS.md
  - Contributing: CONTRIBUTING.md
  - Security: security-notes.md
  - Known Workarounds: known-workarounds.md
  - Todo: TODO.md
  - Completion Roadmap: COMPLETION-ROADMAP.md
  - Verification: VERIFICATION-2026-09-11.md
  - Compatibility Matrix: COMPATIBILITY-MATRIX.md
  - Memory: MEMORY.md
  - Design:
      - Plan: design/PLAN.md
      - Authorization Model: design/AUTHORIZATION-MODEL.md
      - Coding Principles: design/CODING-PRINCIPLES.md
      - Command Tiers: design/COMMAND-TIERS.md
      - Component Naming: design/COMPONENT-NAMING.md
