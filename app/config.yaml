# --- HA Add-on (App) Configuration Schema --------------------------------
# Reference: https://developers.home-assistant.io/docs/apps/configuration/
#
# This is the canonical doc for every field below. Before editing this
# file, confirm any new schema validator or top-level field against that
# page — it lists the accepted types (str/bool/int/float/email/url/
# password/port/match/list/device + nested objects up to 2 levels) and
# the valid values for arch, hassio_role, map, panel_icon, etc.
#
# Why a literal comment instead of a yaml-language-server schema URL:
# HA does not publish a JSON Schema for this manifest, so VS Code cannot
# validate the file. The link is for the human (or agent) editing it.
#
# Drift history that this comment is meant to prevent:
#   - b7-b8: identity.user_agent_map used `dict?` which is not in the
#     validator set; broke Supervisor's manifest re-parse silently.
#     Fixed in b9 (list-of-objects shape).
#   - b8-b9: arch listed `armv7`, which Supervisor logs as deprecated.
#     Fixed in b10.
# -------------------------------------------------------------------------
---
name: OpenClaw HA Node — App
version: "2026.7.1b2"
slug: openclaw_hass_node
description: >
  OpenClaw gateway peripheral for Home Assistant (beta). Connects this HA
  instance to the OpenClaw gateway as a node, exposing filesystem, shell,
  and HA control surfaces. The Assist conversation relay streams replies
  token-by-token through a parallel pair of node-role and operator-role
  gateway connections; pair the device with a dual-role profile
  (`openclaw qr`).
url: https://github.com/clawd-ops/openclaw-hass-node
arch:
  - amd64
  - aarch64
init: false
# hassio_api: enabled so SUPERVISOR_TOKEN reliably lands in the addon
# environment for `ha_client.py` to authenticate against
# http://supervisor/core/api (Issue #109). HA docs state homeassistant_api
# alone also uses SUPERVISOR_TOKEN for the Core proxy, but in practice
# we observed three fresh installs (2026-06-08, -06-09, -06-19) come up
# with no token until hassio_api was set — whether Supervisor bug or
# manifest interaction, enabling hassio_api is the dependable fix.
#
# The Tier A add-on command surface reads Supervisor add-on endpoints such
# as /addons, /addons/<slug>/logs, /info, /stats, /changelog, and
# /documentation. The default role returns 403 for those endpoints, while
# manager is narrower than admin and covers add-on management surfaces.
# Do not add lifecycle mutation commands without a separate admin gate.
hassio_api: true
hassio_role: manager
# homeassistant_api: enables HA Core API access at
# http://supervisor/core/api with SUPERVISOR_TOKEN. Used by `ha_client`
# and `commands/ha` to proxy HA Core/WS calls.
homeassistant_api: true
# auth_api intentionally omitted: the local HTTP API authenticates with a
# shared bearer (`local_api_token`) via `hmac.compare_digest`, not via the
# HA Auth API. Re-enable only if a shipped surface validates HA-issued
# tokens with the Supervisor auth endpoint.
map:
  # /config — write capability granted at the OS layer so the
  # proposal-approved write path can land without re-touching this
  # manifest. For the fs.* mutation commands (fs.write, fs.patch,
  # fs.restore, fs.move, fs.delete) the actual write-protection
  # boundary is the software gate: `_is_protected("/config")` returns
  # True and each handler returns `PROPOSAL_REQUIRED` before any disk
  # write/unlink/rename is attempted (see app/node/src/openclaw_node/
  # commands/fs_write.py, commands/fs_patch.py, commands/fs_move_delete.py).
  # NOT gated: `system.run` (commands/system_run.py) is admin-token
  # gated (OPENCLAW_ADMIN_TOKEN) and can write anywhere the mount
  # allows, including /config. The admin token is the protection
  # boundary there, NOT _is_protected. Don't broaden system.run's
  # capabilities without re-evaluating this trade-off.
  - type: config
    read_only: false
  # /share — backs the per-file content-addressed backup store
  # (/share/openclaw-backups) and the delete trash fallback
  # (/share/openclaw-trash). Real shipped writes.
  - type: share
    read_only: false
  # /media — allowed root, not protected, so `fs.write` can resolve
  # and atomically write here.
  - type: media
    read_only: false
# Removed maps (re-add when a shipped feature needs them):
#   ssl:ro      — would expose TLS certs via generic fs.read/list/glob
#   addons:ro   — no shipped add-on enumeration reader
#   backup:ro   — exposing /backup leaks full-backup material via generic reads
options:
  gateway_url: "wss://gateway.example.com/ws"
  pairing_token: ""
  node_name: ""
  local_api_token: ""
  # One-shot pairing reset on next startup. UI is a boolean toggle:
  #   false (default) - do nothing.
  #   true            - wipe the persisted device-token only; keep the
  #                     device identity so a fresh setup-code from the
  #                     SAME device record re-pairs. Safe recovery from
  #                     an AUTH_TOKEN_MISMATCH loop.
  # Power users can request a full IDENTITY wipe (also deletes node-key.json,
  # forcing a brand-new gateway device record + a brand-new setup-code) by
  # setting the env var directly on the add-on container:
  #     OPENCLAW_RESET_PAIRING=identity
  # The UI does not expose identity-mode because it is destructive enough
  # to warrant an explicit out-of-band step.
  # Toggle back to false after the node re-pairs successfully - otherwise
  # every restart will wipe again.
  reset_pairing: false
  identity:
    # HA usernames allowed to receive the super_admin prompt context.
    # The addon resolves usernames to HA user IDs at startup. HA admins
    # not listed here resolve to admin; everyone else resolves to user.
    # These are HA usernames, not Discord/OpenClaw identities.
    super_admins: []
    # Optional per-HA-user gateway agent routing. The agents themselves are
    # configured in OpenClaw's gateway config; this addon only picks which
    # agentId to send on chat.send for each HA user. List of
    # {ha_username, agent_id} pairs — list-of-dicts is the HA-canonical
    # addon-schema shape for an arbitrary key-value map.
    user_agent_map: []
    # Empty preserves today's gateway-default routing.
    default_agent_id: ""
    # HA actor metadata is signed by the HACS integration with a key derived from
    # local_api_token, so there is no separate actor-signing secret to paste.
    # Advanced prompt-policy patches as JSON. Defaults are generated in code;
    # use add/remove to adjust a role without replacing the whole default list.
    # Example: {"user":{"add":["ha.call_service:lock.unlock"],"remove":[]}}
    forbidden_commands: ""
  addon_lifecycle:
    # Tier B lifecycle commands (`ha.addon_start`/stop/restart) default-deny
    # every slug and require explicit opt-in here. Authorization is the
    # pairing-session bearer (local_api_token) plus this allowlist — no
    # separate admin token. Add a slug ONLY for add-ons you accept the
    # operator-side risk of remote start/stop/restart on.
    allowlist: []
    # Always denied in code too: homeassistant, supervisor, and core_*.
    denylist:
      - homeassistant
      - supervisor
  # HA credentials fallback (intentionally placed at the bottom of the
  # options form). Leave blank to use the Supervisor-injected
  # SUPERVISOR_TOKEN against http://supervisor/core, which is the normal
  # path on HassOS/Supervised installs. Set both fields only when running
  # the addon stand-alone (no Supervisor) OR when SUPERVISOR_TOKEN is
  # unavailable for any reason and you need a long-lived token fallback.
  # hass_url is the HA base URL (e.g. http://homeassistant:8123 from
  # inside the add-on network, or your full HTTPS URL externally) and
  # hass_token is a long-lived access token from a HA user with the
  # scopes your ha.* calls need.
  #
  # Browser autofill gotcha: a [text-field][password-field] pair in a
  # form will sometimes get auto-populated by a password manager with
  # ("your username", "your password"). These two fields are placed at
  # the end of the options form, separated from the other password
  # fields above by the `identity` and `addon_lifecycle` nested blocks,
  # to keep them out of any autofill chain. If you ever see a value in
  # `hass_url` you didn't type (e.g. a HA username), check your
  # browser's password manager — it didn't come from this addon.
  hass_url: ""
  hass_token: ""
schema:
  gateway_url: url
  pairing_token: password
  node_name: str?
  local_api_token: password?
  # bool? — the UI exposes a simple toggle (false=none, true=token).
  # The 2026.6.8a9 string-mode schema (`str?`) broke existing add-on
  # installs whose options store had `reset_pairing: false` (bool):
  # HA's options schema validation runs against the SAVED value, which
  # was a bool and therefore rejected by `str?` with "not a valid value".
  # Falling back to bool? keeps the upgrade smooth; identity-mode is
  # reachable via the OPENCLAW_RESET_PAIRING=identity env var for the
  # rare case the UI toggle is not enough.
  reset_pairing: bool?
  identity:
    super_admins:
      - str
    user_agent_map:
      - ha_username: str
        agent_id: str
    default_agent_id: str?
    forbidden_commands: str?
  addon_lifecycle:
    allowlist:
      - str
    denylist:
      - str
  hass_url: str?
  hass_token: password?
# No `ports:` host-mapping. The local API is only reachable inside the
# Supervisor add-on network (the HACS integration uses the add-on hostname). A
# host-mapped port would expose the API to anything on the host network,
# and the API is bearer-auth-gated only when local_api_token is set.
ingress: false
panel_icon: mdi:robot-happy
# No `image:` key — Supervisor builds locally from app/Dockerfile.
# Once P7 ships a release workflow that publishes per-arch images to
# GHCR, re-add: image: ghcr.io/clawd-ops/openclaw-hass-node/{arch}
