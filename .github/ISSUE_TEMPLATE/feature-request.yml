name: Feature request
description: Suggest a new capability or enhancement.
title: "[feat] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What can't you do today (or have to work around)?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would you like this to work? Concrete UX if you have it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one wins.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - App / packaging (openclaw-hass-node-app)
        - Node command surface (fs.* / system.* / ha.*)
        - HACS integration (openclaw-hass-node-assist)
        - Gateway plugin (openclaw-hass-node-assist-tools)
        - Companion skill (openclaw-hass-node-skill)
        - Assist conversation relay
        - Docs
        - Other
