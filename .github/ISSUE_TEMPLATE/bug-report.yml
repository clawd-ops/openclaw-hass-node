name: Bug report
description: The add-on, node, or HACS shim is misbehaving.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in everything you can — the more
        context, the faster this gets fixed.
  - type: input
    id: addon_version
    attributes:
      label: openclaw-hass-node version
      description: Add-on / node version (e.g. `2026.6.8a3`). Visible in HA's add-on page.
      placeholder: "2026.6.8a3"
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: Settings → About in HA.
      placeholder: "2026.6.0"
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Which component?
      multiple: true
      options:
        - Add-on (node runs inside)
        - Standalone node (no add-on)
        - HACS shim (custom_components/openclaw_hass_node_assist)
        - Gateway pairing / connect
        - Assist conversation relay
        - fs.* / system.* / ha.* commands
        - Other / unsure
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what did you get instead?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Node add-on logs and any relevant HA logs.
        Redact `wss://...` URLs / tokens if sensitive.
      render: text
    validations:
      required: false
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, config snippets, gateway version, etc.
