name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check node/src node/tests
      - name: ruff format check
        run: uv run ruff format --check node/src node/tests

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: mypy --strict
        run: uv run mypy --strict node/src node/tests

  test:
    name: Test (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: pytest with branch coverage
        run: uv run pytest node/tests/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: bandit
        run: uv run bandit -r node/src -ll
      - name: pip-audit
        run: uv run pip-audit

  addon-smoke:
    name: Build Add-on (amd64 smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker build smoke (amd64)
        run: docker build -f addon/Dockerfile .
