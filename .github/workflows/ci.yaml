name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: ruff check
        run: uv run ruff check openclaw_hass_node/node/src openclaw_hass_node/node/tests
      - name: ruff format check
        run: uv run ruff format --check openclaw_hass_node/node/src openclaw_hass_node/node/tests

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: mypy --strict
        run: uv run mypy --strict openclaw_hass_node/node/src openclaw_hass_node/node/tests

  test:
    name: Test (node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: pytest with branch coverage
        run: uv run pytest openclaw_hass_node/node/tests/

  security:
    name: Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Set up Python 3.13
        run: uv python install 3.13
      - name: Install workspace deps
        run: uv sync --all-extras
      - name: bandit
        run: uv run bandit -r openclaw_hass_node/node/src -ll
      - name: pip-audit
        run: uv run pip-audit

  addon-smoke:
    name: Build Add-on (amd64 smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Docker build smoke (amd64)
        # Build context is openclaw_hass_node/ — matches what Supervisor uses on-device.
        # The directory name MUST match the addon's slug for Supervisor's
        # store discovery to reconcile installed instances with store entries.
        run: docker build openclaw_hass_node

  version-sync:
    name: Version Sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Verify all five version files agree
        run: scripts/bump-version.py --check
