name: Auto-cut release on version bump

# Runs after every push to main. If the current synced version literal
# does not yet have a matching `v<version>` git tag, this job creates the
# tag and a GitHub release with notes derived from Conventional Commits
# since the previous tag, augmented by any hand-written section in
# `app/CHANGELOG.md`.
#
# Release note strategy (TODO #19):
#   1. Auto-generate grouped notes from `git log <prev>..HEAD --pretty="%s"`
#      via `scripts/generate-release-notes.sh`.
#   2. If app/CHANGELOG.md already has a hand-written section for this
#      version: use that as the primary body, append the auto-generated
#      commit list as a secondary "Commits" block.
#   3. If no hand-written section exists: use the auto-generated list as
#      the sole body AND commit a new section to app/CHANGELOG.md so the
#      HA Supervisor Changelog tab always has content.
#   app/CHANGELOG.md is NOT in the `paths:` trigger, so the commit-back
#   does not cause a recursive re-run.
#
# Background: HA Supervisor's Update prompt reads from published GitHub
# releases, not from main. Before this workflow, every `release:` PR
# merge had to be followed by a manual `git tag` + `gh release create`,
# which got forgotten more than once (LESSONS.md → "Release PR merged ≠
# release cut"). This closes that gap.
#
# Versions on the alpha (`aN`) / beta (`bN`) / rc (`rcN`) tracks are
# cut as prereleases. Final releases (`1.0.0`, `2026.7.0`) are full
# releases.
on:
  push:
    branches: [main]
    paths:
      - "app/config.yaml"
      - "app/build.yaml"
      - "app/node/pyproject.toml"
      - "app/node/src/openclaw_node/__init__.py"
      - "custom_components/openclaw_hass_node_assist/manifest.json"
      - ".github/workflows/release-on-version-bump.yml"

jobs:
  cut-release:
    name: Cut release if version bumped
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Read current synced version
        id: version
        run: |
          set -euo pipefail
          VERSION=$(scripts/bump-version.py --get)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Current synced version: $VERSION"
      - name: Skip if tag already exists
        id: tag_check
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — nothing to do."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag $TAG does not exist — will cut release."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Find previous release tag
        if: steps.tag_check.outputs.skip == 'false'
        id: prev_tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          PREV=$(git tag --sort=-v:refname | grep -v "^${TAG}$" | head -1 || true)
          if [[ -z "$PREV" ]]; then
            echo "No previous tag found (first release)."
            echo "prev_tag=" >> "$GITHUB_OUTPUT"
          else
            echo "Previous tag: $PREV"
            echo "prev_tag=$PREV" >> "$GITHUB_OUTPUT"
          fi
      - name: Build release notes (hand-written + auto-commits)
        if: steps.tag_check.outputs.skip == 'false'
        id: notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.prev_tag.outputs.prev_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # 1. Extract any hand-written CHANGELOG section for this version.
          # Matches headings like: ## 2026.7.1b2 (2026-07-01) — title
          # and captures everything until the next "## " heading.
          HANDWRITTEN=$(mktemp)
          awk -v ver="$VERSION" '
            BEGIN { in_section = 0 }
            /^## / {
              if (in_section) exit
              split($0, h, " ")
              if (h[2] == ver) { in_section = 1; next }
            }
            in_section { print }
          ' app/CHANGELOG.md > "$HANDWRITTEN"

          # 2. Auto-generate grouped notes from Conventional Commits.
          AUTO=$(mktemp)
          bash scripts/generate-release-notes.sh "${PREV_TAG:-}" HEAD > "$AUTO"

          # 3. Combine into the final release-notes file.
          NOTES_FILE=$(mktemp)
          CHANGELOG_UPDATED=false

          if [[ -s "$HANDWRITTEN" ]]; then
            # Hand-written section exists: use it as the primary body and
            # append the auto-derived commit list as a secondary block.
            cat "$HANDWRITTEN" > "$NOTES_FILE"
            if [[ -s "$AUTO" ]]; then
              printf '\n---\n### Commits since %s\n' "${PREV_TAG:-initial}" >> "$NOTES_FILE"
              cat "$AUTO" >> "$NOTES_FILE"
            fi
          elif [[ -s "$AUTO" ]]; then
            # No hand-written section: auto-generated list is the sole body.
            cat "$AUTO" > "$NOTES_FILE"
            # Also prepend a new section to app/CHANGELOG.md so HA Supervisor
            # Changelog tab always has content. (CHANGELOG.md is not in the
            # workflow trigger paths, so this commit does not re-run the job.)
            {
              printf '## %s\n\n' "$VERSION"
              cat "$AUTO"
              printf '\n'
              cat app/CHANGELOG.md
            } > app/CHANGELOG.md.new
            mv app/CHANGELOG.md.new app/CHANGELOG.md
            CHANGELOG_UPDATED=true
          else
            # Nothing to show — emit a minimal stub.
            printf 'Release %s.\n\nFull changelog: https://github.com/%s/blob/main/app/CHANGELOG.md\n' \
              "$VERSION" "$REPOSITORY" > "$NOTES_FILE"
          fi

          echo "notes_file=$NOTES_FILE" >> "$GITHUB_OUTPUT"
          echo "changelog_updated=$CHANGELOG_UPDATED" >> "$GITHUB_OUTPUT"
          echo "=== Release notes preview ==="
          cat "$NOTES_FILE"
      - name: Commit auto-generated CHANGELOG section
        if: steps.tag_check.outputs.skip == 'false' && steps.notes.outputs.changelog_updated == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "clawd-ops[bot]"
          git config user.email "clawd-ops@users.noreply.github.com"
          git add app/CHANGELOG.md
          git commit -m "docs(changelog): auto-generate release notes for $VERSION"
          git push origin HEAD:main
      - name: Tag the release commit
        if: steps.tag_check.outputs.skip == 'false'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "clawd-ops[bot]"
          git config user.email "clawd-ops@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"
      - name: Cut GitHub release
        if: steps.tag_check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
          NOTES_FILE: ${{ steps.notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          # Extract the title line from CHANGELOG ("## VERSION (date) — title")
          TITLE=$(awk -v ver="$VERSION" '
            /^## / {
              split($0, heading, " ")
              if (heading[2] != ver) next
              sub("^## ", "")
              print
              exit
            }
          ' app/CHANGELOG.md)
          if [[ -z "$TITLE" ]]; then
            TITLE="$VERSION"
          fi
          PRE_FLAG=""
          if [[ "$PRERELEASE" == "true" ]]; then
            PRE_FLAG="--prerelease"
          fi
          gh release create "$TAG" \
            --title "$TITLE" \
            $PRE_FLAG \
            --notes-file "$NOTES_FILE"
