name: TS

on:
  pull_request:
    paths:
      - "plugins/**"
      - "app/node/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "docs/reference/api/typescript/**"
      - "scripts/check-typescript-api-docs.sh"
      - ".github/workflows/ts.yml"
  push:
    branches: [main]
    paths:
      - "plugins/**"
      - "app/node/**"
      - "pyproject.toml"
      - "uv.lock"
      - "package.json"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "docs/reference/api/typescript/**"
      - "scripts/check-typescript-api-docs.sh"
      - ".github/workflows/ts.yml"

jobs:
  typecheck:
    name: TS Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm install
        run: pnpm install --no-frozen-lockfile
      - name: pnpm typecheck
        run: pnpm -r --filter './plugins/*' typecheck

  test:
    name: TS Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v8.2.0
      - name: Install contract-test Python
        run: uv python install 3.13
      - name: Prepare Python for cross-language command contracts
        run: uv sync --package openclaw-node --python 3.13
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm install
        run: pnpm install --no-frozen-lockfile
      - name: pnpm test
        run: pnpm -r --filter './plugins/*' test

  api-reference:
    name: TypeScript API Reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: pnpm install
        run: pnpm install --no-frozen-lockfile
      - name: Verify generated TypeScript API reference
        run: pnpm docs:typescript:check
