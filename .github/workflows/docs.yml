name: Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build Docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs dependencies
        run: pip install -r docs-requirements.txt

      - name: Install project package (for mkdocstrings introspection)
        run: pip install --no-deps app/node

      - name: Build docs (strict)
        env:
          # The site is intentionally pinned to MkDocs 1.x because MkDocs 2.x
          # removes the plugin APIs required by Material and mkdocstrings.
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      # `--strict` cannot fail on a missing Markdown extension: unrecognised
      # syntax is emitted as literal text, not reported. This asks whether
      # pymdownx.tasklist actually ran, by looking for the class it emits.
      - name: Check task lists rendered
        run: python scripts/assert-tasklists-rendered.py site
