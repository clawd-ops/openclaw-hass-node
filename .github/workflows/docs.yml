name: Docs

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Build Docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install MkDocs dependencies
        run: pip install -r docs-requirements.txt

      - name: Install project package (for mkdocstrings introspection)
        run: pip install --no-deps app/node

      - name: Build docs (strict)
        env:
          # The site is intentionally pinned to MkDocs 1.x because MkDocs 2.x
          # removes the plugin APIs required by Material and mkdocstrings.
          NO_MKDOCS_2_WARNING: "1"
        run: mkdocs build --strict

      # `--strict` does not catch Markdown that uses an extension the site does
      # not enable: the syntax is not recognised, so it is emitted as literal
      # text and the build passes with the page shipped broken. This scans the
      # output the previous step just produced.
      - name: Check for unrendered Markdown syntax
        run: python scripts/lint-rendered-docs.py site
