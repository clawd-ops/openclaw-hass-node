[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openclaw-node"
version = "2026.6.0"
description = "OpenClaw gateway peripheral node for Home Assistant."
requires-python = ">=3.13"
dependencies = [
    "websockets>=13.0",
    "cryptography>=43.0",
    "aiohttp>=3.10",
    "pydantic>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "pyright>=1.1",
    "ruff>=0.8",
    "bandit>=1.8",
    "pip-audit>=2.7",
    "pydoclint>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openclaw_node"]
